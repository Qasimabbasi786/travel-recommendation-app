<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelBloom - Contact Us</title>
  <link rel="stylesheet" href="travel_recommendation.css" />
</head>
<body>
  <nav>
        <div class="logo">TravelBloom</div>
        <ul class="nav-links">
            <li><a href="travel_recommendation.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html" class="active">Contact Us</a></li>
        </ul>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Enter beach, temple, or country..." />
            <button id="btnSearch">Search</button>
            <button id="btnClear">Clear</button>
        </div>
    </nav>

  <main class="container">
    <form class="contact-form" onsubmit="event.preventDefault(); alert('Message sent successfully!');">
      <h2>Contact Us</h2>
      <div class="form-group" style="margin-top: 15px;">
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="Your full name" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="example@email.com" />
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" rows="4" required placeholder="Write your message here..."></textarea>
      </div>
      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
